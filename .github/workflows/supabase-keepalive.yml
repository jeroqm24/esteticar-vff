name: Supabase Keepalive

on:
  schedule:
    - cron: '0 9 * * 1,4'  # Lunes y jueves a las 9:00 UTC
  workflow_dispatch:        # Permite ejecutarlo manualmente si es necesario

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-client-info: keepalive" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/clients?select=phone&limit=1")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "206" ]; then
            echo "Ping failed with status $STATUS"
            exit 1
          fi
