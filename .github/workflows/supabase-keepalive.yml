name: Supabase Keepalive

on:
  schedule:
    - cron: '0 9 * * 1,4'  # Lunes y jueves a las 9:00 UTC
  workflow_dispatch:        # Permite ejecutarlo manualmente si es necesario

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -v --max-time 15 \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://nziybzrpscyyuywwebnm.supabase.co/rest/v1/clients?select=phone&limit=1" \
            2>&1 || true
          echo "Keepalive ping completado"
