name: Supabase Keepalive

on:
  schedule:
    - cron: '0 9 * * 1,4'  # Lunes y jueves a las 9:00 UTC
  workflow_dispatch:        # Permite ejecutarlo manualmente si es necesario

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://nziybzrpscyyuywwebnm.supabase.co/rest/v1/")
          echo "Supabase ping status: $STATUS"
          if [ "$STATUS" = "000" ]; then
            echo "No se pudo conectar a Supabase"
            exit 1
          fi
          echo "Ping OK"
