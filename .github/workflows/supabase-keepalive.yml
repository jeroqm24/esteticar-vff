name: Supabase Keepalive

on:
  schedule:
    - cron: '17 13 * * *'  # Todos los días a las 13:17 UTC (fuera de hora en punto, evita que GitHub la descarte por alta carga)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -sf --max-time 15 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "https://nziybzrpscyyuywwebnm.supabase.co/rest/v1/appointments?select=id&limit=1" \
            && echo "Keepalive OK" || echo "Keepalive FAILED"
